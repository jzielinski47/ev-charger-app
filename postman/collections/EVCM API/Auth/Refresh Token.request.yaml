$kind: http-request
name: Refresh Token
description: Exchanges the refresh token from Login for a new access and refresh token. The old refresh token can no longer be used.
method: POST
url: "{{baseUrl}}/api/auth/refresh"
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const oldRefreshToken = pm.collectionVariables.get("refreshToken");

      pm.test("refreshed", () => pm.response.to.have.status(200));
      pm.test("refresh token is rotated", () => {
          pm.expect(pm.response.json().refreshToken).to.be.a("string").and.not.equal(oldRefreshToken);
      });
      pm.collectionVariables.set("token", pm.response.json().token);
      pm.collectionVariables.set("refreshToken", pm.response.json().refreshToken);

      pm.sendRequest({
          url: pm.variables.replaceIn("{{baseUrl}}/api/auth/refresh"),
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: { mode: "raw", raw: JSON.stringify({ refreshToken: oldRefreshToken }) }
      }, (err, res) => {
          pm.test("old refresh token is rejected with 401", () => {
              pm.expect(err).to.be.null;
              pm.expect(res.code).to.equal(401);
          });
      });
    language: text/javascript
order: 2500
