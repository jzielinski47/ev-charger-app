$kind: http-request
name: Login Admin
method: POST
url: "{{baseUrl}}/api/auth/login"
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@localhost",
      "password": "admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("logged in", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("admin_token", pm.response.json().token);
    language: text/javascript
order: 3000
