$kind: http-request
name: Change Password
description: Changes the password, then changes it back so the collection can be run again. Both calls return a new token pair and revoke older refresh tokens.
method: PUT
url: "{{baseUrl}}/api/users/me/password"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "zaq1@WSX",
      "newPassword": "xsw2!QAZ"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("password changed and new tokens returned", () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().refreshToken).to.be.a("string");
      });

      pm.sendRequest({
          url: pm.variables.replaceIn("{{baseUrl}}/api/users/me/password"),
          method: "PUT",
          header: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + pm.response.json().token
          },
          body: { mode: "raw", raw: JSON.stringify({ currentPassword: "xsw2!QAZ", newPassword: "zaq1@WSX" }) }
      }, (err, res) => {
          pm.test("password restored", () => {
              pm.expect(err).to.be.null;
              pm.expect(res.code).to.equal(200);
          });
          pm.collectionVariables.set("token", res.json().token);
          pm.collectionVariables.set("refreshToken", res.json().refreshToken);
      });
    language: text/javascript
order: 4000
