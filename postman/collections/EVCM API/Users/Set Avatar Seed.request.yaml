$kind: http-request
name: Set Avatar Seed
description: Stores the DiceBear seed the frontend renders the avatar from. Send {"seed": null} to fall back to initials.
method: PUT
url: "{{baseUrl}}/api/users/me/avatar"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "seed": "Felix-42"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("avatar seed saved", () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().avatarSeed).to.equal("Felix-42");
      });
    language: text/javascript
order: 3000
