$kind: graphql-request
name: Fetch Local Chargers Near Krakow
description: Remove vehicleId from variables to list all chargers; with it, only chargers compatible with that vehicle (must belong to the logged-in user).
url: "{{baseUrl}}/graphql/chargers"
query: |
  query AllChargerPointsInProximity($vehicleId: ID) {
      allChargerPointsInProximity(lat: 50.0748, lon: 19.9979, proximity: 15.0, vehicleId: $vehicleId) {
          id
          isOperational
          usageCost
          numberOfPoints
          dateLastVerified
          operator {
              name
              websiteUrl
              phone
          }
          addressInfo {
              title
              latitude
              longitude
          }
          connections {
              connectorType
              currentType
              powerKW
          }
      }
  }
variables: |-
  {
    "vehicleId": "{{vehicleId}}"
  }
settings: {}
schema:
  source: file
  location: /home/jzielinski/SoftwareDevelopment/ev-charger-map/src/main/resources/graphql/schema.graphqls
order: 3000
