$kind: http-request
name: Anonymous Limit
description: Anonymous clients get 5 requests per minute per IP. The sixth request in a row must be rejected with 429.
method: GET
url: "{{baseUrl}}/api/vehicles"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("first anonymous request is denied by security or already throttled", () => {
          pm.expect(pm.response.code).to.be.oneOf([401, 429]);
      });

      const capacity = 5;
      const send = (remaining) => pm.sendRequest({ url: pm.variables.replaceIn("{{baseUrl}}/api/vehicles"), method: "GET" }, (err, res) => {
          if (remaining > 1 && res.code !== 429) {
              send(remaining - 1);
              return;
          }
          pm.test("anonymous requests over the limit return 429", () => {
              pm.expect(err).to.be.null;
              pm.expect(res.code).to.equal(429);
          });

          pm.test("429 has Retry-After and JSON error body", () => {
              const retryAfter = Number(res.headers.get("Retry-After"));
              pm.expect(retryAfter).to.be.within(1, 60);
              pm.expect(res.json().error).to.equal("Too Many Requests");
          });
      });
      send(capacity);
    language: text/javascript
order: 1000
