$kind: http-request
name: Add Vehicle
method: POST
url: "{{baseUrl}}/api/vehicles"
headers:
  Content-Type: application/json
queryParams:
  - key: targetEmail
    value: john.doe@example.com
    disabled: true
    description: "Admin only: add vehicle for a specific user by email"
body:
  type: json
  content: |-
    {
      "brand": "Tesla",
      "model": "Model 3",
      "yearOfProduction": 2022,
      "supportedInlets": ["CCS2", "TYPE_2"],
      "vehicleOriginatingMarket": "EUROPE",
      "batteryCapacityKwh": 60.0,
      "maxAcPowerKw": 11.0,
      "maxDcPowerKw": 170.0,
      "acPhases": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("created", () => pm.response.to.be.success);
      pm.collectionVariables.set("vehicleId", pm.response.json().id);
    language: text/javascript
order: 1000
