$kind: http-request
name: Modify Vehicle
method: PUT
url: "{{baseUrl}}/api/vehicles/{{vehicleId}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Tesla",
      "model": "Model Y",
      "yearOfProduction": 2023,
      "supportedInlets": ["CCS2", "TYPE_2"],
      "vehicleOriginatingMarket": "EUROPE",
      "batteryCapacityKwh": 75.0,
      "maxAcPowerKw": 11.0,
      "maxDcPowerKw": 250.0,
      "acPhases": 3
    }
order: 4000
