$kind: http-request
name: Health Check
description: Public, rate-limit-free health check.
method: GET
url: "{{baseUrl}}/actuator/health"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("server is up", () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().status).to.equal("UP");
      });
    language: text/javascript
order: 1000
