# APPLICATION
# java 21 virtual threads enabled
spring.threads.virtual.enabled=true
spring.web.error.include-message=always

# DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SECURITY
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXP_TIME}

admin.email=${ADMIN_EMAIL:admin@localhost}
admin.password=${ADMIN_PASSWORD:admin}

# GRAPHQL
spring.graphql.graphiql.enabled=true
spring.graphql.http.path=/graphql/chargers

# OPEN CHARGE MAP & CHARGER SYNC
opencharge.api.key=${OPEN_CHARGE_API_KEY}

charger.sync.enabled=true
charger.sync.latitude=50.0339
charger.sync.longitude=19.5842
charger.sync.distance-in-km=50
charger.sync.max-results=500

# LOGGING
logging.pattern.console=%d{HH:mm:ss} %-5level - %msg%n
spring.output.ansi.enabled=ALWAYS

logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.apache.catalina=WARN
logging.level.org.flywaydb=INFO
logging.level.jz.pk.evcm=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
#logging.level.org.springframework.security=TRACE